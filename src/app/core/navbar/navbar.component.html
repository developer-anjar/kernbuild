<header class="navbar" [class.scrolled]="scrolled()" [class.navbar--cinematic]="isHomeRoute() && !scrolled()">
  <div class="navbar__container">
    <a class="navbar__logo" routerLink="/" fragment="home" (click)="scrollTo('home')" aria-label="KernBuild home">
      <span class="navbar__logo-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32" fill="none">
          <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
          <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32"><stop offset="0%" stop-color="#FF5A0A"/><stop offset="100%" stop-color="#6426E8"/></linearGradient></defs>
          <path d="M10 8l6 8-6 8M16 16h6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="navbar__brand">
        <span class="navbar__brand-text"><span class="navbar__brand-kern">kern</span><span class="navbar__brand-build">build</span></span>
        <span class="navbar__brand-tagline">Build from the Core</span>
      </span>
    </a>

    <nav id="primary-navigation" class="navbar__nav" [class.open]="mobileMenuOpen()" aria-label="Main navigation">
      @for (link of navLinks; track link.fragment) {
        <a
          class="navbar__link"
          [class.active]="activeSection() === link.fragment"
          routerLink="/"
          [fragment]="link.fragment"
          [attr.aria-current]="activeSection() === link.fragment ? 'location' : null"
          (click)="scrollTo(link.fragment)">
          {{ link.label }}
        </a>
      }
      <a class="navbar__cta navbar__cta--mobile" routerLink="/" fragment="contact" (click)="scrollTo('contact')">
        Let's Build <span aria-hidden="true">→</span>
      </a>
    </nav>

    <a class="navbar__cta navbar__cta--desktop" routerLink="/" fragment="contact" (click)="scrollTo('contact')">
      Let's Build <span aria-hidden="true">→</span>
    </a>

    <button
      class="navbar__hamburger"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="primary-navigation"
      [attr.aria-label]="mobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'">
      <span class="navbar__hamburger-line" [class.open]="mobileMenuOpen()"></span>
      <span class="navbar__hamburger-line" [class.open]="mobileMenuOpen()"></span>
      <span class="navbar__hamburger-line" [class.open]="mobileMenuOpen()"></span>
    </button>
  </div>
</header>
