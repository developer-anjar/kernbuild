<article class="section">
  <div class="container">
    <header class="page-heading">
      <p class="eyebrow">KernBuild</p>
      <h1>{{ page.heading }}</h1>
      <p>{{ page.introduction }}</p>
    </header>
    <div class="legal-copy">
      @for (section of page.sections; track section.title) {
        <section>
          <h2>{{ section.title }}</h2>
          <p>{{ section.body }}</p>
        </section>
      }
    </div>
  </div>
</article>
