<article class="project-card">
  <div class="project-card__image">
    <div class="project-card__placeholder">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
      <span class="project-card__placeholder-text">{{ project().title }}</span>
    </div>
    <img
      class="project-card__image-file"
      [src]="project().imagePath"
      [alt]="project().title + ' project preview'"
      loading="lazy"
      (error)="onImageError($event)">
  </div>
  <div class="project-card__body">
    <span class="project-card__badge">{{ project().category }}</span>
    <h3 class="project-card__title">{{ project().title }}</h3>
    <p class="project-card__desc">{{ project().description }}</p>
    <div class="project-card__tags">
      @for (tech of project().technologies; track tech) {
        <span class="project-card__tag">{{ tech }}</span>
      }
    </div>
    <div class="project-card__actions">
      @if (hasLiveUrl) {
        <a [href]="project().liveUrl" target="_blank" rel="noopener noreferrer" class="project-card__btn project-card__btn--primary">
          Live Demo →
        </a>
      }
      @if (hasSourceUrl) {
        <a [href]="project().sourceUrl" target="_blank" rel="noopener noreferrer" class="project-card__btn project-card__btn--outline">
          View Code
        </a>
      }
      @if (!hasLiveUrl && !hasSourceUrl) {
        <span class="project-card__coming-soon">Links coming soon</span>
      }
    </div>
  </div>
</article>
