<section class="section section--lavender">
  <div class="container">
    <header class="section-heading">
      <p class="eyebrow">Why KernBuild</p>
      <h2>Thoughtful work. Clear collaboration.</h2>
      <p>The way we build matters just as much as what we build.</p>
    </header>
    <div class="reasons-grid">
      @for (reason of reasons; track reason.title) {
        <article class="reason-card">
          <span class="reason-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="reason.icon"/></svg>
          </span>
          <div><h3>{{ reason.title }}</h3><p>{{ reason.description }}</p></div>
        </article>
      }
    </div>
  </div>
</section>
