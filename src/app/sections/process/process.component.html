<section class="section" id="process">
  <div class="container">
    <header class="section-heading">
      <p class="eyebrow">How we work</p>
      <h2>A clear path from idea to launch</h2>
      <p>Collaborative at every step, with clear decisions and progress along the way.</p>
    </header>
    <div class="process-grid">
      @for (step of steps; track step.step) {
        <article class="process-card">
          <span class="process-number">0{{ step.step }}</span>
          <span class="process-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path [attr.d]="step.icon"/></svg>
          </span>
          <h3>{{ step.title }}</h3>
          <p>{{ step.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
