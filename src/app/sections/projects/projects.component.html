<section class="section section--cinematic" id="projects">
  <div class="container">
    <header class="section-heading">
      <p class="eyebrow">Selected projects</p>
      <h2>Ideas taking shape</h2>
      <p>A few of the products we’re building. Project visuals are placeholders until final screenshots are available.</p>
    </header>
    <div class="projects-grid">
      @for (project of projectService.featuredProjects(); track project.id) {
        <app-project-card [project]="project" />
      }
    </div>
    <div class="section-action">
      <a class="button button--outline" routerLink="/projects">Browse projects and filters <span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
